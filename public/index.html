<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153041"><title>Endurance</title>
<link rel="icon" type="image/png" href="icon-64.png"><link rel="apple-touch-icon" href="icon.png">
<script src="theme.js"></script><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="themes.css">
</head>
<body>
<div class="shell">
<header class="masthead">
  <div class="brand"><img src="icon.png" alt="" width="56" height="56"><div><h1>Endurance</h1><p>Stop watching gauges. Go sailing.</p></div></div>
  <nav aria-label="Dashboard controls"><label class="unit-picker"><span>Volumes</span><select id="units" aria-label="Displayed volume units"><option value="litres">Litres</option><option value="gallons">US gallons</option><option value="m3">m³</option></select></label><button id="refresh" type="button">Refresh</button><a href="/admin/#/serverConfiguration/plugins/signalk-endurance">Settings</a><span class="theme-controls" role="group" aria-label="Display theme"><button id="theme" type="button" class="theme-control" aria-label="Change display theme">☾</button><button id="theme-auto" type="button" aria-pressed="true" title="Follow vessel day/night and navigation state">Auto</button></span></nav>
</header>
<main>
  <section id="summary" class="summary tone-neutral" aria-labelledby="summary-title">
    <div class="summary-copy"><p class="eyebrow" id="summary-label">YOUR BOAT, AT A GLANCE</p><h2 id="summary-title">Connecting to your boat…</h2><p id="summary-message">Waiting for the latest resource assessment.</p></div>
    <div class="summary-meta"><span id="mode" class="mode" hidden>Preview</span><p id="coverage">—</p><p id="updated">Not yet updated</p></div>
  </section>
  <div id="connection" class="notice" role="status" aria-live="polite" hidden></div>
  <section id="attention" class="attention" aria-label="Resources needing attention" hidden><h2>Needs your attention</h2><ul id="attention-list"></ul></section>
  <section aria-labelledby="resources-title"><div class="section-heading"><h2 id="resources-title">Your resources</h2><span id="notification-note"></span></div><div id="resources" class="resources"></div></section>
</main>
<footer><span>Updates automatically</span><a href="https://github.com/SCarns/signalk-endurance#readme" target="_blank" rel="noopener noreferrer">Help &amp; documentation</a></footer>
</div>
<script src="view-model.js"></script><script src="dashboard.js"></script>
</body></html>
